services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_PATH: /data/recruit.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - appdata:/data
      - ./sample_data:/sample_data:ro
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  appdata:
